# Keyword -> category rules used to auto-categorize transactions.
# Matching is case-insensitive substring matching against the transaction description.
# Edit freely from the "Manage Categories" page in the app, or by hand here.
# The first matching category wins, so put more specific keywords above general ones.
#
# Note: some CSV exports truncate long descriptions (e.g. "FITNESS FIRST
# STREATHA" cuts off "M"), so keywords here favor shorter, truncation-safe
# fragments over full merchant names where possible.

